                album: "4masks",
                duration: 240,
                // No file was ever served at /audio/0 - Paint Exchange.flac. The track lives
                // on IPFS; trackCid is how we reach it.
                trackCid: "QmcBuh5HCvVCCdCz6KqWf891QkXeKc3T7QBaToYE8mSLtS",
                ensemble: {
                    "Justin Holmes": ["mandolin", "throatsinging"],
                    "Cory Walker": ["5-string banjo"],
                    "Samson Grisman": ["bass"],
                    "John Mailander": ["fiddle"],
                    "Kaitlyn Raitz": ["cello"],
                    "Harry Clark": ["guitar"]
                },
                timeline: {
                    0: {
                        musicians: {
                            "Justin Holmes": "in",
                            "Cory Walker": "out",
                            "Samson Grisman": "out",
                            "John Mailander": "out",
                            "Kaitlyn Raitz": "out",
                            "Harry Clark": "out"
                        },
                        solo: "Justin Holmes",
                        part: "A"
                    },
                    13: { musicians: { "band": "in" } },
                    27: { solo: "John Mailander" },
                    47: { part: "B" },
                    59: { part: "A" },
                    72: { solo: "Kaitlyn Raitz" },
                    83: { solo: "Harry Clark" },
                    106: { solo: "Samson Grisman", part: "B" },
                    118: { solo: "Cory Walker", part: "A" },
                    166: { solo: "John Mailander", part: "B" },
                    183: { solo: "Justin Holmes", instrumentChanges: { "Justin Holmes": "throatsinging" } },
                    190: { part: "A" }
                },
                standardSectionLength: 20
            }
        };

        // Color scheme
        const defaultColorScheme = {
            solo: { border: "#4a7c59", background: "rgba(74, 124, 89, 0.1)", textColor: "#2d5016", glowColor: "rgba(74, 124, 89, 0.4)" },
            pickup: { border: "#87a96b", background: "rgba(135, 169, 107, 0.1)", textColor: "#5a7a4a" }
        };
        Object.values(songs).forEach(song => { song.colorScheme = defaultColorScheme; });

        // If a ?track={cid} URL param is present, fetch the track's data from
        // the wiki and use that as the active song. This is the production
        // entry point: pickipedia's Release pages link here with their CID,
        // e.g. /rabbithole/pickipedia-demo.html?track=QmS3QEZF...
        //
        // Falls back to the hardcoded `songs['august']` when no param is
        // present (preserves the standalone demo for local dev).
        const IPFS_GATEWAY = 'https://ipfs.delivery-kid.cryptograss.live';

        async function fetchYamlPage(title) {
            const params = new URLSearchParams({
                action: 'query',
                titles: title,
                prop: 'revisions',
                rvprop: 'content',
                rvslots: 'main',
                format: 'json',
                origin: '*'
            });
            const r = await fetch('/api.php?' + params);
            const j = await r.json();
            const page = Object.values(j.query?.pages || {})[0];
            if (!page || page.missing !== undefined) return null;
            const text = page.revisions?.[0]?.slots?.main?.['*'] || '';
            return jsYaml.load(text) || {};
        }

        // Pull ensemble + timeline + standardSectionLength out of a metadata
        // YAML object. Supports two shapes:
        //
        //   1. Flat — keys at top level (the format my editor saves):
        //        ensemble: {...}
        //        timeline: {...}
        //        standardSectionLength: 13.65
        //
        //   2. Arthel song YAML — for paste-the-whole-file convenience:
        //        studio_versions:
        //          0:
        //            <AlbumName>:
        //              ensemble: {...}
        //              rabbithole:
        //                timeline: {...}
        //                standardSectionLength: 13.65
        //
        // For arthel shape, we walk the first studio version → first release
        // and pull ensemble (sibling) + rabbithole.{timeline,standardSectionLength}.
        function extractMetadata(data) {
            if (!data || typeof data !== 'object') return {};
            // Shape 1: flat
            if (data.timeline || data.ensemble) {
                return {
                    ensemble: data.ensemble || {},
                    timeline: data.timeline || {},
                    standardSectionLength: data.standardSectionLength,
                    title: data.title,
                    album: data.album,
                    record: data.record,
                    studio: data.studio,
                    sessionType: data['session-type'] || data.sessionType,
                    engineer: data.engineer
                };
            }
            // Shape 2: arthel studio_versions tree
            const studioVersions = data.studio_versions;
            if (studioVersions && typeof studioVersions === 'object') {
                const firstVersionKey = Object.keys(studioVersions)[0];
                const firstVersion = studioVersions[firstVersionKey];
                if (firstVersion && typeof firstVersion === 'object') {
                    const firstReleaseKey = Object.keys(firstVersion)[0];
                    const release = firstVersion[firstReleaseKey];
                    if (release && typeof release === 'object') {
                        const rh = release.rabbithole || {};
                        return {
                            ensemble: release.ensemble || {},
                            timeline: rh.timeline || {},
                            standardSectionLength: rh.standardSectionLength,
                            title: firstReleaseKey,
                            album: firstReleaseKey,
                            record: release.record,
                            studio: release.studio,
                            sessionType: release['session-type'],
                            engineer: release.engineer
                        };
                    }
                }
            }
            return {};
        }

        /*
         * Which encoding this browser can actually decode.
         *
         * Every Release carries ogg and flac. Ogg is a quarter the size, so
         * it is the default -- but Safari went most of its life unable to
         * decode Ogg Vorbis at all, and an iPhone that cannot decode it plays
         * silence without saying why. FLAC Safari has handled since Safari 11.
         *
         * So ask the browser rather than guess from a version number: a
         * `canPlayType` of "probably" or "maybe" is the only claim either of
         * us has. Prefer ogg when it is playable, fall back to flac, and if
         * the browser disclaims both, hand back ogg and let the error surface
         * rather than silently returning nothing.
         */
        function pickEncoding(encodings) {
            if (!encodings) return null;

            // ?enc=flac / ?enc=ogg forces one, for telling a decoding fault
            // apart from everything else without changing any code.
            const forced = INITIAL_PARAMS.get('enc');
            if (forced && encodings[forced]) {
                return { cid: encodings[forced], format: forced };
            }

            const probe = document.createElement('audio');
            const ok = type => {
                const verdict = probe.canPlayType(type);
                return verdict === 'probably' || verdict === 'maybe';
            };
            if (encodings.ogg && ok('audio/ogg; codecs="vorbis"')) {
                return { cid: encodings.ogg, format: 'ogg' };
            }
            if (encodings.flac && ok('audio/flac')) {
                return { cid: encodings.flac, format: 'flac' };
            }
            if (encodings.ogg) {
                console.warn(
                    'This browser claims it can play neither ogg nor flac; '
                    + 'trying ogg anyway.');
                return { cid: encodings.ogg, format: 'ogg' };
            }
            return null;
        }

        async function loadTrackFromWiki(cid) {
            const trackData = await fetchYamlPage('Release:' + cid);
            if (!trackData) {
                throw new Error('Track Release page not found: ' + cid);
            }
            const metadataData = await fetchYamlPage('Release:' + cid + '/Metadata') || {};
            const metadata = extractMetadata(metadataData);

            const encoding = pickEncoding(trackData.encodings);
            if (!encoding) {
                throw new Error('Track has no encoding this browser can play');
            }

            return {
                title: trackData.title || metadata.title || cid,
                album: trackData.parent_release || metadata.album || '',
                duration: trackData.duration || 180,
                audioFile: IPFS_GATEWAY + '/ipfs/' + encoding.cid,
                ensemble: metadata.ensemble,
                timeline: metadata.timeline,
                standardSectionLength: metadata.standardSectionLength,
                _trackCid: cid,
                _metadataTitle: 'Release:' + cid + '/Metadata',
                _record: metadata.record,
                _studio: metadata.studio,
                _sessionType: metadata.sessionType,
                _engineer: metadata.engineer
            };
        }

        /*
         * The four built-in songs name a trackCid, not a file.
         *
         * They used to name /audio/August.flac and friends, which nothing has
         * ever served -- 404 on the preview and on production alike, which is
         * why picking a song from the dropdown played silence. The audio was
         * always on IPFS; only the ?track= path knew how to reach it.
         *
         * Resolved once per song and cached on the object, so switching back
         * and forth does not re-fetch the Release page.
         */
        async function resolveAudioFile(song) {
            if (!song || song.audioFile || !song.trackCid) return song;
            const release = await fetchYamlPage('Release:' + song.trackCid);
            const encoding = pickEncoding(release && release.encodings);
            if (!encoding) {
                throw new Error(
                    'No playable encoding on Release:' + song.trackCid
                    + ' -- nothing to play.');
            }
            song.audioFile = IPFS_GATEWAY + '/ipfs/' + encoding.cid;

            /*
             * While the Release page is open, take what the album row needs.
             *
             * Without this the four built-in songs had no cover and no track
             * list -- the album row only ever filled in for a ?track= link --
             * so the default page looked like a different, poorer app than
             * the one a listen button opens. Skyler kept being shown layout
             * changes to a row that was not on his screen.
             *
             * `album` holds the parent release's CID because that is what
             * loadAlbum wants; the four songs used to carry a record's name
             * there, which nothing could look up.
             */
            if (release.parent_release) song.album = release.parent_release;
            song._trackCid = song.trackCid;
            if (release.title) song.title = release.title;
            return song;
        }

        // The album this track belongs to: title and the full track list.
        // Track Release pages carry parent_release; the parent is a
        // release_type: record page whose `tracks:` is the running order.
        async function loadAlbum(parentCid) {
            if (!parentCid) return null;
            const album = await fetchYamlPage('Release:' + parentCid);
            if (!album || !Array.isArray(album.tracks)) return null;
            return { cid: parentCid, title: album.title || '', tracks: album.tracks };
        }

        // Cover art, the long way round, because the release schema has no
        // field for it. The record page links to the release
        // ("Tracks are here: [[Release:Qm...]]"), so the backlink finds the
        // record page, and the first image on it that is not an instrument
        // icon is the cover. Fragile by nature — if it finds nothing we show
        // no art rather than a broken frame. The honest fix is an art field
        // on the release, which is a schema change and Justin's call.
        async function findAlbumArt(parentCid) {
            const q = params => fetch('/api.php?' + new URLSearchParams(
                Object.assign({ format: 'json', origin: '*' }, params))).then(r => r.json());

            const back = await q({ action: 'query', list: 'backlinks',
                bltitle: 'Release:' + parentCid, blnamespace: '0', bllimit: '5' });
            const recordPage = back.query?.backlinks?.[0]?.title;
            if (!recordPage) return null;

            const imgs = await q({ action: 'query', titles: recordPage,
                prop: 'images', imlimit: '50' });
            const candidates = (Object.values(imgs.query?.pages || {})[0]?.images || [])
                .map(i => i.title)
                .filter(t => !/Instrument-icon-/i.test(t));
            if (!candidates.length) return null;

            const info = await q({ action: 'query', titles: candidates[0],
                prop: 'imageinfo', iiprop: 'url|size', iiurlwidth: '96' });
            const ii = Object.values(info.query?.pages || {})[0]?.imageinfo?.[0];
            if (!ii) return null;
            // thumburl is absent wherever the wiki has no thumbnailer — which
            // is exactly the case on the preview container, so asking only for
            // the thumb made the cover vanish in the one place anybody is
            // looking at it. The full file is 400px square; CSS sizes it.
            return sameOrigin(ii.thumburl || ii.url || null);
        }

        /*
         * The wiki answers with absolute URLs built from its own $wgServer,
         * so a cover came back as http://…:4009/images/… -- the wiki's port,
         * not the page's. Every other request this page makes is relative and
         * goes through whatever host served it; only the images jumped
         * straight at the wiki. Anyone who can reach the page but not that
         * port gets no cover and no error, which is how Skyler ended up
         * looking at an empty square and reasonably reading it as a layout
         * fault.
         *
         * Same path, this origin. The wiki's own images route is proxied, so
         * there is nothing to configure.
         */
        function sameOrigin(url) {
            if (!url) return null;
            try {
                const u = new URL(url, window.location.href);
                return u.pathname + u.search;
            } catch (err) {
                return url;
            }
        }

        async function populateAlbumRow(song) {
            const row = document.getElementById('album-row');
            const sel = document.getElementById('album-track-select');
            const art = document.getElementById('album-art');
            if (!row || !sel || !art) return;

            const album = await loadAlbum(song.album);
            if (!album) return;

            sel.innerHTML = '';
            album.tracks.slice()
                .sort((a, b) => (a.track_number || 0) - (b.track_number || 0))
                .forEach(t => {
                    const o = document.createElement('option');
                    o.value = t.cid;
                    o.textContent = (t.track_number ? t.track_number + '. ' : '')
                        + (t.title || t.cid);
                    if (t.cid === song._trackCid) o.selected = true;
                    sel.appendChild(o);
                });
            sel.title = album.title;
            // Changing track is a navigation, not a swap: the whole shell
            // keys off ?track=, and a reload is honest about that.
            sel.onchange = () => {
                const url = new URL(window.location.href);
                url.searchParams.set('track', sel.value);
                window.location.href = url.toString();
            };

            row.style.display = '';

            const artUrl = await findAlbumArt(album.cid);
            if (artUrl) {
                art.onerror = () => { art.style.display = 'none'; };
                art.src = artUrl;
                art.alt = album.title || 'album art';
                art.style.display = '';
            }
        }

        async function openPaneForTrack(song) {
            const fallback = song._metadataTitle;
            if (!song.title) { openWikiPage(fallback, { push: false }); return; }

            const songPage = 'Song:' + song.title;
            try {
                const params = new URLSearchParams({
                    action: 'query', titles: songPage, format: 'json', origin: '*'
                });
                const r = await fetch('/api.php?' + params);
                const page = Object.values((await r.json()).query?.pages || {})[0];
                const exists = page && page.missing === undefined;
                openWikiPage(exists ? songPage : fallback, { push: false });
            } catch (err) {
                console.warn('Could not check for a song page:', err);
                openWikiPage(fallback, { push: false });
            }
        }

        function populateSongInfoHeader(song) {
            if (!song) return;
            const header = document.getElementById('song-info-header');
            const titleEl = document.getElementById('song-title-display');
            const metaEl = document.getElementById('recording-metadata');
            if (!header || !titleEl || !metaEl) return;
            titleEl.textContent = song.title || 'Untitled';
            const metaParts = [];
            if (song._record) metaParts.push('Recorded ' + song._record);
            if (song._studio) metaParts.push(song._studio);
            if (song._sessionType) metaParts.push(song._sessionType);
            if (song._engineer) metaParts.push('Engineer: ' + song._engineer);
            metaEl.innerHTML = metaParts.map(p =>
                '<span>' + (window.mw && window.mw.html ? window.mw.html.escape(p)
                    : p.replace(/[<>&]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c])))
                + '</span>'
            ).join('');
            header.style.display = '';
        }

        // jsyaml is loaded as a UMD global from the <script> tag in <head>.
        const jsYaml = window.jsyaml;

        const trackParam = INITIAL_PARAMS.get('track');
        if (trackParam) {
            try {
                const wikiSong = await loadTrackFromWiki(trackParam);
                wikiSong.colorScheme = defaultColorScheme;
                songs[trackParam] = wikiSong;
                window.songChartifactsData = wikiSong;
                // Hide the song selector — we're locked to one track in this mode.
                const selector = document.getElementById('song-selector');
                if (selector) selector.style.display = 'none';
                // Park the right pane on the song's own page, falling back to
                // the track's /Metadata page. Skyler's idea, and the right one:
                // a song should open on the song, not on the YAML somebody
                // edits it with. See Song:August/mock for where the title match
                // breaks — the release carries a title and a CID, and nothing
                // that says which page is about the work.
                openPaneForTrack(wikiSong);
                // Populate the title + recording-info header.
                populateSongInfoHeader(wikiSong);
                // Cover and the rest of the record, under the title. Async and
                // non-blocking: if the wiki is slow or the art is missing, the
                // player is already playing and simply has no cover.
                populateAlbumRow(wikiSong).catch(
                    err => console.warn('Could not build the album row:', err));
            } catch (err) {
                console.error('Failed to load track from wiki:', err);
                document.getElementById('webamp-player').innerHTML =
                    '<p style="padding:1em;color:#a00">Could not load track ' +
                    trackParam + ': ' + err.message + '</p>';
                window.songChartifactsData = songs['august'];
            }
        } else {
            const first = songs['august'];
            await resolveAudioFile(first).catch(
                err => console.error('Could not resolve the default track:', err));
            window.songChartifactsData = first;
            populateSongInfoHeader(first);
            // The cover and the title, but not the album's track list: the
            // demo selector is still the way around these four, because they
            // carry hand-written timelines the wiki does not have yet. Two
            // selectors in one row would be two ways to do one thing, and on
            // a phone they share a cell and land on top of each other.
            populateAlbumRow(first)
                .then(() => {
                    const albumSel = document.getElementById('album-track-select');
                    if (albumSel) albumSel.style.display = 'none';
                })
                .catch(err => console.warn('Could not build the album row:', err));
        }
        window.allSongs = songs;

        // === The wiki pane ===
        //
        // Settled 2026-10-11 and only now built: no iframe. The wiki is
        // fetched same-origin and put into a div we own, and the same click
        // that moves the pane pushes the real wiki URL. So the address bar
        // reads /wiki/Cory_Walker while the song keeps playing, and that URL
        // is a thing you can send somebody.
        //
        // What this gives up: the metadata editor that lives on a
        // Release:.../Metadata page. Injected HTML does not run scripts, so
        // that editor no longer boots in the pane — the postMessage bridge
        // below is now dead weight for that path. The shell's own Edit
        // Timeline panel is untouched and is the editing route that matters.
        // The pane is a shadow root, which is the whole trick: MediaWiki's own
        // stylesheet goes in with the content and cannot reach back out to
        // restyle the bar. Without it the wiki arrives naked — no infobox
        // frames, no instrument icons, no yellow wash on bot claims — because
        // a div full of parsed wikitext inherits nothing. The iframe used to
        // bring all of this along for free; this is the price of the URL.
        const PANE_STYLES = [
            // The same modules a real article page loads, in the same skin.
            // This asked for Vector and for the generic content styles, and the
            // wiki runs MonoBook -- but the one that actually mattered was
            // ext.pickipediaContent.styles, the extension's own stylesheet. It
            // is what draws the proposal markers, the verify affordances and
            // the studio blocks, so without it every bot-written paragraph
            // rendered as a bare grey bar with [unverified] floating beside it.
            // That is what "the backdrop looks super broken" was.
            '<link rel="stylesheet" href="/load.php?lang=en&modules=',
            'ext.pickipediaContent.styles%7Cskins.monobook.styles',
            '&only=styles&skin=monobook">',
            '<link rel="stylesheet" href="/load.php?lang=en&modules=',
            'site.styles&only=styles&skin=monobook">',
            '<style>',
            ':host { display: block; font-size: 14px; line-height: 1.5;',
            '  color: #202122; font-family: -apple-system, BlinkMacSystemFont,',
            '  "Segoe UI", Roboto, sans-serif; }',
            'img { max-width: 100%; height: auto; }',
            'table { max-width: 100%; }',
            '.pane-title { font-size: 22px; font-weight: 700; color: #2d5016;',
            '  margin: 0 0 .4em; border-bottom: 1px solid #e5e7e1;',
            '  padding-bottom: .2em; }',
            '.pane-loading { color: #6b7566; font-size: 13px; }',
            'h2 { font-size: 18px; margin: 1em 0 .3em; }',
            'h3 { font-size: 15px; margin: .8em 0 .3em; }',
            '.mw-editsection { display: none; }',
            '</style>'
        ].join('');


        /* ------------------------------------------------------------------
         * How much of the wiki the pane wears.
         *
         * Three ways, switchable from the pane itself, because this is a look
         * to be judged rather than argued about:
         *
         *   content  the article and nothing else (what we have been looking at)
         *   header   a small header we own: title, a search that works, and a
         *            way out to the real page
         *   skin     MonoBook's full chrome, fetched and injected
         *
         * The honest caveat on 'skin', and the reason it is not the default:
         * injected HTML does not run scripts. The sidebar and tabs are real
         * links and do work, but the search box is furniture -- it accepts
         * typing and does nothing. A control that looks real and isn't is
         * worse than no control, so it is labelled where it sits.
         * ------------------------------------------------------------------ */
        const PANE_MODES = ['content', 'header', 'skin'];

        function paneMode() {
            const saved = localStorage.getItem('rabbitholePaneMode');
            return PANE_MODES.includes(saved) ? saved : 'content';
        }

        const CHROME_STYLES = [
            '<style>',
            '.pane-chrome { display: flex; align-items: center; gap: 8px;',
            '  padding: 6px 8px; margin: -4px -4px 10px; background: #f3f5f1;',
            '  border-bottom: 1px solid #d8ddd3; font-size: 13px;',
            '  position: sticky; top: 0; z-index: 5; }',
            '.pane-chrome .pane-search { flex: 1 1 auto; min-width: 60px;',
            '  padding: 4px 6px; border: 1px solid #c3cbbb; border-radius: 3px;',
            '  font: inherit; }',
            '.pane-chrome a { color: #2d5016; text-decoration: none; }',
            '.pane-chrome a:hover { text-decoration: underline; }',
            '.pane-mode { font: inherit; padding: 3px; border: 1px solid #c3cbbb;',
            '  border-radius: 3px; background: #fff; }',
            '.pane-results { list-style: none; padding: 0; margin: 0; }',
            '.pane-results li { padding: 5px 0; border-bottom: 1px solid #eceee8; }',
            '.pane-results a { font-weight: 600; }',
            '.pane-results .snippet { color: #5a6354; font-size: 12px; }',
            '.pane-fake-note { background: #fff6d8; border: 1px solid #e3d08a;',
            '  padding: 5px 8px; font-size: 12px; margin: 0 0 8px; }',
            '</style>'
        ].join('');

        function modeSwitcher() {
            const current = paneMode();
            return '<select class="pane-mode" title="How much of the wiki to show">'
                + PANE_MODES.map(function (m) {
                    return '<option value="' + m + '"'
                        + (m === current ? ' selected' : '') + '>' + m + '</option>';
                }).join('')
                + '</select>';
        }

        async function paneBody(title, parsed) {
            const path = '/wiki/' + title.replace(/ /g, '_');
            const mode = paneMode();

            if (mode === 'skin') {
                // MonoBook renders the chrome server-side, so take the real
                // page rather than rebuilding it. action=parse gives only the
                // article body, which is why this is a second fetch.
                try {
                    const html = await (await fetch(path)).text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const wrapper = doc.getElementById('globalWrapper');
                    if (wrapper) {
                        wrapper.querySelectorAll('script, #siteNotice').forEach(function (el) {
                            el.remove();
                        });
                        return CHROME_STYLES
                            + '<div class="pane-chrome">' + modeSwitcher()
                            + '<span>MonoBook, as the wiki renders it</span></div>'
                            + '<div class="pane-fake-note">The search box below is '
                            + 'furniture: injected HTML cannot run scripts, so it '
                            + 'accepts typing and does nothing. The sidebar and tab '
                            + 'links are real.</div>'
                            + wrapper.outerHTML;
                    }
                } catch (err) {
                    console.warn('Could not fetch the full page for skin mode', err);
                }
                // Fall through to the article rather than showing nothing.
            }

            // Wrapped in the containers MonoBook's rules hang off. action=parse
            // returns the parser output on its own, and most of a skin's
            // typography is written as '#content .thing', so without these the
            // rules match nothing.
            const article = '<div id="globalWrapper"><div id="column-content">'
                + '<div id="content" class="mw-body"><div class="mw-body-content">'
                + '<h1 class="pane-title firstHeading">'
                + (parsed.displaytitle || title) + '</h1>'
                + parsed.text
                + '</div></div></div></div>';

            if (mode === 'header') {
                return CHROME_STYLES
                    + '<div class="pane-chrome">' + modeSwitcher()
                    + '<input class="pane-search" type="search" '
                    + 'placeholder="Search PickiPedia" aria-label="Search PickiPedia">'
                    + '<a href="' + path + '" target="_blank" rel="noopener">open ↗</a>'
                    + '</div>' + article;
            }

            return CHROME_STYLES + '<div class="pane-chrome">' + modeSwitcher()
                + '<span>article only</span></div>' + article;
        }

        function wirePaneChrome(root) {
            rewirePaneLinks(root);

            const select = root.querySelector('.pane-mode');
            if (select) {
                select.addEventListener('change', function () {
                    localStorage.setItem('rabbitholePaneMode', select.value);
                    // Re-render where we are, without adding a history entry.
                    const here = decodeURIComponent(location.pathname.replace('/wiki/', ''))
                        .replace(/_/g, ' ');
                    openWikiPage(here || 'Justin Holmes', { push: false });
                });
            }

            const search = root.querySelector('.pane-search');
            if (search) {
                search.addEventListener('keydown', async function (ev) {
                    if (ev.key !== 'Enter' || !search.value.trim()) return;
                    const params = new URLSearchParams({
                        action: 'query', list: 'search', srsearch: search.value.trim(),
                        srlimit: '15', format: 'json', formatversion: '2', origin: '*'
                    });
                    const data = await (await fetch('/api.php?' + params)).json();
                    const hits = data.query?.search || [];
                    const body = root.querySelector('.mw-body-content');
                    if (!body) return;
                    body.innerHTML = '<h1 class="pane-title">' + hits.length
                        + ' result' + (hits.length === 1 ? '' : 's') + ' for '
                        + search.value.trim() + '</h1><ul class="pane-results">'
                        + hits.map(function (hit) {
                            return '<li><a href="/wiki/'
                                + encodeURIComponent(hit.title.replace(/ /g, '_'))
                                + '">' + hit.title + '</a>'
                                + '<div class="snippet">' + (hit.snippet || '')
                                + '</div></li>';
                        }).join('') + '</ul>';
                    rewirePaneLinks(root);
                });
            }
        }

        async function openWikiPage(title, { push = true, force = false } = {}) {
            const pane = document.getElementById('pickipedia-frame');
            if (!pane) return;
            const path = '/wiki/' + title.replace(/ /g, '_');

            // Already here. Re-fetching and rebuilding the article that is
            // already in the pane costs a request and two layouts and shows
            // a "Loading" flash for nothing -- whether the repeat comes from
            // tapping a musician card for whoever is already on screen, from
            // a popstate, or from a solo returning with no one in between.
            // August does not happen to do the last one; other songs will.
            if (!force && pane.dataset.wikiTitle === title) {
                if (push) history.pushState({ wikiTitle: title }, '', path);
                return;
            }

            const shadow = pane.shadowRoot || pane.attachShadow({ mode: 'open' });
            // Only blank the pane when there is nothing in it. Replacing a
            // rendered article with "Loading" and then with the next article
            // is two layouts and a flash where one layout will do.
            if (!pane.dataset.wikiTitle) {
                shadow.innerHTML = PANE_STYLES
                    + '<div class="pane-loading">Loading ' + title + '…</div>';
            }

            try {
                const params = new URLSearchParams({
                    action: 'parse', page: title, prop: 'text|displaytitle',
                    formatversion: '2', format: 'json', origin: '*'
                });
                const data = await (await fetch('/api.php?' + params)).json();
                const parsed = data.parse;
                if (!parsed) throw new Error(data.error?.info || 'no such page');

                const root = pane.shadowRoot || pane.attachShadow({ mode: 'open' });
                root.innerHTML = PANE_STYLES + await paneBody(title, parsed);
                pane.dataset.wikiTitle = title;
                wirePaneChrome(root);
                pane.scrollTop = 0;
                rewirePaneLinks(root);
                if (push) history.pushState({ wikiTitle: title }, '', path);
                else history.replaceState({ wikiTitle: title }, '', path);
            } catch (err) {
                console.warn('Could not open', title, err);
                (pane.shadowRoot || pane.attachShadow({ mode: 'open' })).innerHTML =
                    PANE_STYLES + '<div class="pane-loading">Could not load '
                    + title + ' — <a href="' + path + '">open it directly</a>.</div>';
            }
        }

        // Links inside the pane stay inside the pane. Anything that is not an
        // ordinary wiki page — an edit link, a Special: page, an off-site
        // link — is left alone and opens the normal way.
        /**
         * A Listen in Rabbithole button inside the pane does not go anywhere.
         *
         * Sky, 2026-10-18: "the listen on RH button with the chase will just
         * expand that tab if its not open and start playing the song and just
         * start playing it if the tab is open".
         *
         * Following the link would reload the shell, which throws away the
         * player, the queue and whatever is playing -- the one thing a dock
         * exists to avoid. So the click is caught, the track CID is lifted out
         * of the href, and the running player is handed the new song.
         *
         * The href stays exactly as it is, because outside this shell -- on the
         * wiki proper, in a Mood, in somebody's bookmarks -- following it is
         * precisely the right behaviour.
         */
        function rewireListenButtons(pane) {
            pane.querySelectorAll('a[href*="/rabbithole/"]').forEach(a => {
                let cid;
                try {
                    cid = new URL(a.href, location.origin).searchParams.get('track');
                } catch (err) {
                    return;
                }
                if (!cid) return;

                let action;
                try {
                    action = new URL(a.href, location.origin).searchParams.get('action');
                } catch (err) {
                    action = null;
                }

                a.addEventListener('click', async e => {
                    e.preventDefault();
                    if (action === 'trail') {
                        await trailToHere(a, cid);
                    } else if (action === 'queue') {
                        queueTrack(cid, a);
                    } else {
                        await playTrackInDock(cid);
                    }
                });
            });
        }

        /* ------------------------------------------------------------------
         * The queue.
         *
         * Justin, 2026-10-18, on what "Listen in Rabbithole" could mean:
         * listen now, listen next, or find me a rabbithole from here to there.
         * This is the second one. The third needs the catalog and is not this.
         *
         * The player has been calling window.playNextInRabbithole() when a
         * track ends since before any of this, and nothing has ever defined
         * it -- so a finished song just stopped. This defines it.
         * ------------------------------------------------------------------ */
        const rabbitholeQueue = [];

        /* ------------------------------------------------------------------
         * Trails: how you get from what is playing to the song you are
         * reading about, through the people who played on both.
         *
         * Justin's third meaning of "Listen in Rabbithole", and the only one
         * that earns the name. The graph is already on the wiki -- Has
         * performer subobjects, one per person per song, carrying the
         * instrument -- so every hop is true because somebody played it.
         *
         * The search itself is in src/trail.js and is tested there. This is
         * only the fetching and the showing.
         * ------------------------------------------------------------------ */
        let performerGraphPromise = null;

        function performerGraph() {
            if (!performerGraphPromise) {
                const params = new URLSearchParams({
                    action: 'ask', format: 'json', origin: '*',
                    query: '[[Has performer::+]]|?Has performer|?Has instrument|limit=500'
                });
                performerGraphPromise = fetch('/api.php?' + params)
                    .then(r => r.json())
                    .then(d => buildGraph(d.query && d.query.results))
                    .catch(err => {
                        console.warn('Could not read the performer graph', err);
                        performerGraphPromise = null;
                        return { band: {}, plays: {} };
                    });
            }
            return performerGraphPromise;
        }

        /**
         * The track CID a song page carries, read off its own listen button.
         *
         * This is the song-to-recording edge, and it does not exist as data:
         * nothing on the wiki says "this composition was released as that
         * CID". What does exist is the listen button, which a human put the
         * CID into. So the button is the edge, for now. When a real property
         * exists this should read that instead.
         */
        const cidForSong = {};

        async function trackCidForSong(songTitle) {
            if (cidForSong[songTitle] !== undefined) {
                return cidForSong[songTitle];
            }

            const params = new URLSearchParams({
                action: 'parse', page: songTitle, prop: 'text',
                formatversion: '2', format: 'json', origin: '*'
            });
            try {
                const data = await (await fetch('/api.php?' + params)).json();
                const html = data.parse && data.parse.text;
                const match = html && html.match(/[?&]track=([A-Za-z0-9]+)/);
                cidForSong[songTitle] = match ? match[1] : null;
            } catch (err) {
                cidForSong[songTitle] = null;
            }
            return cidForSong[songTitle];
        }

        /** The song page for whatever is playing, as a page title. */
        function playingSongTitle() {
            const data = window.songChartifactsData;
            return data && data.title ? 'Song:' + data.title : null;
        }

        async function trailToHere(button, targetCid) {
            const target = 'Song:' + (
                document.getElementById('pickipedia-frame')
                    .shadowRoot.querySelector('.pane-title, .firstHeading')
                    ?.textContent.replace(/^Song:/, '').trim() || ''
            );
            const from = playingSongTitle();

            if (!from) {
                flashButton(button, 'nothing playing to start from');
                return;
            }
            if (from === target) {
                flashButton(button, 'you are already here');
                return;
            }

            flashButton(button, 'looking…');
            const graph = await performerGraph();
            const hops = findTrail(graph, from, target);

            if (!hops) {
                flashButton(button, 'no way there from here');
                return;
            }

            renderTrail(from, hops);

            // Queue the songs along the way, so the trail is a thing you can
            // listen to rather than only read.
            const queued = [];
            for (const song of trailSongs(from, hops).slice(1)) {
                const cid = await trackCidForSong(song);
                if (cid && !rabbitholeQueue.includes(cid)) {
                    rabbitholeQueue.push(cid);
                    queued.push(song);
                }
            }
            flashButton(button, hops.length + ' hop' + (hops.length === 1 ? '' : 's')
                + ', ' + queued.length + ' queued');
        }

        function renderTrail(from, hops) {
            const pane = document.getElementById('pickipedia-frame');
            const root = pane && pane.shadowRoot;
            if (!root) return;

            root.querySelectorAll('.pp-trail').forEach(el => el.remove());

            const panel = document.createElement('div');
            panel.className = 'pp-trail';
            panel.setAttribute('style', 'margin:.6em 0; padding:.6em .8em;'
                + 'border:1px solid #c9d3c3; border-left:4px solid #4a7c59;'
                + 'background:#f6f8f4; font-size:13px; line-height:1.5;');
            panel.innerHTML = '<strong>Down the rabbithole from '
                + from.replace(/^Song:/, '') + '</strong><ol style="margin:.4em 0 0; padding-left:1.4em;">'
                + hops.map(hop => '<li>' + hop.via
                    + (hop.instrument ? ' <em>(' + hop.instrument + ')</em>' : '')
                    + ' played on both — to <strong>'
                    + hop.to.replace(/^Song:/, '') + '</strong></li>').join('')
                + '</ol>';

            const body = root.querySelector('.mw-body-content') || root;
            body.insertBefore(panel, body.firstChild);
        }

        function queueTrack(cid, button) {
            if (rabbitholeQueue.includes(cid)) {
                flashButton(button, 'already queued');
                return;
            }

            rabbitholeQueue.push(cid);
            flashButton(button, rabbitholeQueue.length === 1
                ? 'queued — plays next'
                : 'queued — ' + rabbitholeQueue.length + ' waiting');
        }

        /**
         * Say something happened, where the thing happened.
         *
         * Two silent failures turned up today -- a play button that did
         * nothing while the player was still loading, and a listen button
         * whose only complaint was a console warning. Queueing is worse than
         * both: it is invisible by nature, since nothing about the page
         * changes. So the button says so itself.
         */
        /*
         * flashButton rewrites the element's own text, which is right for a
         * button and wrong for a <select> -- setting textContent on a select
         * throws its options away. So for a control that owns its contents,
         * put the message beside it instead.
         */
        function flashBeside(el, message) {
            if (!el || !el.parentNode) return;
            let note = el.parentNode.querySelector('.inline-flash-note');
            if (!note) {
                note = document.createElement('span');
                note.className = 'inline-flash-note';
                note.style.cssText =
                    'margin-left:6px; font-size:11px; color:#a00; white-space:nowrap;';
                el.parentNode.insertBefore(note, el.nextSibling);
            }
            clearTimeout(note._flashTimer);
            note.textContent = message;
            note._flashTimer = setTimeout(() => { note.textContent = ''; }, 4000);
        }

        function flashButton(button, message) {
            if (!button) return;
            const label = button.querySelector('span') || button;

            // Remember the real label the first time, not whatever is showing.
            // Clicking twice inside the flash window would otherwise capture
            // the flashed text as the original and the button would keep it
            // for good -- a button permanently reading "already queued".
            if (label.dataset.restLabel === undefined) {
                label.dataset.restLabel = label.textContent;
            }
            clearTimeout(label._flashTimer);

            label.textContent = message;
            label._flashTimer = setTimeout(() => {
                label.textContent = label.dataset.restLabel;
            }, 2200);
        }

        window.playNextInRabbithole = async function() {
            const next = rabbitholeQueue.shift();
            if (!next) return;
            await playTrackInDock(next);
        };

        async function playTrackInDock(cid) {
            // Open the dock first, so a slow fetch happens in front of the
            // player rather than behind a closed bar.
            if (document.body.classList.contains('bar-collapsed')) {
                window.toggleSidebar();
            }

            try {
                const song = await loadTrackFromWiki(cid);
                window.songChartifactsData = song;

                if (window.chartifactsPlayer
                    && typeof window.chartifactsPlayer.loadNewSong === 'function') {
                    await window.chartifactsPlayer.loadNewSong(song);
                    setTimeout(addMusicianClickHandlers, 500);
                }

                // The track is the shareable thing, so put it in the URL --
                // replace, not push, so Back still means the page you came
                // from rather than the same page minus a song.
                const url = new URL(location.href);
                url.searchParams.set('track', cid);
                history.replaceState({ ...history.state, track: cid }, '', url);
            } catch (err) {
                console.warn('Could not play', cid, 'in the dock', err);
            }
        }

        function rewirePaneLinks(pane) {
            rewireListenButtons(pane);
            pane.querySelectorAll('a[href^="/wiki/"]').forEach(a => {
                const title = decodeURIComponent(
                    a.getAttribute('href').slice('/wiki/'.length)).replace(/_/g, ' ');
                if (/^(Special|File|Category):/.test(title)) return;
                a.addEventListener('click', e => {
                    e.preventDefault();
                    openWikiPage(title);
                });
            });
        }

        window.addEventListener('popstate', (e) => {
            const title = e.state && e.state.wikiTitle;
            if (title) openWikiPage(title, { push: false });
        });

        // Navigate to musician's PickiPedia page
        window.navigateToMusician = function(musicianName) {
            openWikiPage(musicianName);
        };

        // With no ?track=, nothing else fills the pane. The iframe used to
        // carry src="/wiki/Justin_Holmes" as its default; keep that.
        if (!trackParam) {
            openWikiPage('Justin Holmes', { push: false });
        }

        /*
         * The editor button's two labels, in one place.
         *
         * They used to be written as strings at the two points that toggle
         * the editor, which meant anything done to the label elsewhere was
         * undone the first time it was pressed.
         */
        const EDITOR_LABELS = {
            open: 'Edit Timeline',
            close: 'Close Editor',
        };

        window.setEditorButtonLabel = function (which) {
            const btn = document.getElementById('editor-toggle-btn');
            if (!btn) return;
            btn.textContent = EDITOR_LABELS[which];
            btn.title = EDITOR_LABELS[which];
        };

        /*
         * On a phone, the track list says the song and nothing else.
         *
         * "August - Vowel Sounds" is two facts, and the row already carries
         * the second one as the cover beside it. Dropping the album halves
         * the longest label, which is the one thing that decides how wide
         * the control has to be -- and the control has been reading as cut
         * on an iPhone at widths that cannot cut it here, so leave it less
         * to render rather than keep guessing at the width.
         *
         * The full labels stay on a desktop, where there is room for both
         * facts and the album is worth having in the list.
         */
        /* The other half of shortenTrackLabelsOnNarrowScreens: a window
           dragged wide again should get its album names back. */
        /* The switch's caption, long and short. Same reasoning as the track
           list: the full name goes in the tooltip, so nothing is lost. */
        const SWITCH_CAPTION = {
            long: 'Auto-switch artist profiles',
            short: 'Follow artist',
        };

        function setSwitchCaptionForViewport() {
            const cap = document.querySelector('.auto-switch-caption');
            const label = document.querySelector('.auto-switch');
            if (!cap) return;
            const narrow = window.matchMedia('( max-width: 1100px )').matches;

        /*
         * ?rhdiag=1 -- an on-screen readout of what the audio is doing.
         *
         * Skyler hears the audio speed up and slow down on an iPhone, most
         * audibly at the A that follows the first B of August (t=50, where
         * the solo passes to Harry Clark). None of it reproduces on a
         * desktop: the whole 4MB file buffers, there are no long tasks, and
         * audio time tracks wall-clock time to within a tenth of a second
         * across the stretch where he hears it. So the measurement has to
         * happen on the phone, and a phone has no console you can read while
         * you listen.
         *
         * What it shows: the media element's own currentTime against the
         * wall clock. If they stay together, the audio is running at speed
         * and what he is hearing is something else; if the audio falls
         * behind in steps, it is stalling. Buffered end says whether the
         * file is ahead of the playhead. Any waiting/stalled/ratechange the
         * element fires is listed with the time it happened.
         */
        if (INITIAL_PARAMS.get('rhdiag')) {
            const box = document.createElement('div');
            box.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:9999;'
                + 'background:#111; color:#eee; font:13px/1.4 system-ui, sans-serif;'
                + 'padding:8px 10px; pointer-events:none;';
            document.body.appendChild(box);

            const waitForAudio = (tries = 0) => {
                const p = window.chartifactsPlayer;
                const audio = p && p.webamp && p.webamp.media
                    && p.webamp.media._source && p.webamp.media._source._audio;
                if (!audio) {
                    if (tries < 100) setTimeout(() => waitForAudio(tries + 1), 200);
                    return;
                }

                /*
                 * A list, not a latch.
                 *
                 * The first version reported the first thing it saw and then
                 * stopped looking -- and the first thing it saw was itself.
                 * iOS reports the element as playing a little before sound
                 * actually flows, so the opening half-second of silence read
                 * as the audio falling behind, the bar latched on it at
                 * t=1.6s, and the spot that actually matters at t=50 was
                 * never reached. Twice now this thing has cried wolf about
                 * its own startup.
                 *
                 * So: measure drift only once the song has genuinely been
                 * running (two seconds of audio actually advanced), keep the
                 * findings as a list rather than a verdict, and re-arm after
                 * each one so a single early artefact cannot blind the rest.
                 */
                const findings = [];
                const note = (line) => {
                    if (findings.length && findings[findings.length - 1] === line) return;
                    findings.push(line);
                    if (findings.length > 5) findings.shift();
                };
                const render = (status) => {
                    box.innerHTML = findings.length
                        ? '<b>' + findings.join('</b><br><b>') + '</b>'
                            + '<br><span style="color:#9c9; font-size:11px">'
                            + status + '</span>'
                        : '<b>Listening…</b><br><span style="color:#9c9; font-size:11px">'
                            + status + '</span>';
                };
                render('play the song; this bar keeps everything it catches');

                // A seek lands outside what is buffered and fires `waiting` on
                // the way; that is the seek working, not a fault.
                let lastSeekAt = -1e9;
                audio.addEventListener('seeking',
                    () => { lastSeekAt = performance.now(); });

                ['waiting', 'stalled', 'error'].forEach(ev =>
                    audio.addEventListener(ev, () => {
                        if (audio.currentTime < 3) return;
                        if (performance.now() - lastSeekAt < 3000) return;
                        note('STALLED at ' + audio.currentTime.toFixed(1) + 's'
                            + ' (' + ev + ', buffered to '
                            + (audio.buffered.length
                                ? audio.buffered.end(audio.buffered.length - 1).toFixed(0)
                                : 0) + 's)');
                    }));

                audio.addEventListener('ratechange', () => {
                    if (audio.playbackRate !== 1) {
                        note('RATE set to ' + audio.playbackRate
                            + ' at ' + audio.currentTime.toFixed(1) + 's');
                    }
                });

                // Drift: does audio time keep up with the wall clock?
                let wall0 = null, audio0 = null, lastT = null;
                const rebase = () => { wall0 = null; };
                setInterval(() => {
                    const playing = !audio.paused && !audio.ended;
                    const jumped = lastT !== null
                        && Math.abs(audio.currentTime - lastT) > 1.5;
                    lastT = audio.currentTime;

                    if (!playing || jumped) {
                        rebase();
                        render((playing ? 'playing' : 'paused')
                            + ' at ' + audio.currentTime.toFixed(1) + 's');
                        return;
                    }
                    // Warm up: wait for the song to be properly under way
                    // before believing anything the clock says.
                    if (audio.currentTime < 3) {
                        rebase();
                        render('starting… ' + audio.currentTime.toFixed(1) + 's');
                        return;
                    }
                    if (wall0 === null) {
                        wall0 = performance.now(); audio0 = audio.currentTime;
                        return;
                    }
                    const wall = (performance.now() - wall0) / 1000;
                    const drift = (audio.currentTime - audio0) - wall;
                    if (wall > 2 && Math.abs(drift) > 0.25) {
                        note((drift < 0 ? 'FELL BEHIND ' : 'RAN AHEAD ')
                            + Math.abs(drift).toFixed(2) + 's'
                            + ' by ' + audio.currentTime.toFixed(1) + 's');
                        rebase();
                        return;
                    }
                    render('playing at ' + audio.currentTime.toFixed(1) + 's'
                        + (findings.length ? '' : ' · nothing caught yet'));
                }, 250);
            };
            waitForAudio();
        }

        if (isBottomBar) {
            // Initial icon points down (▼) = "click to collapse the bar".
            const initIcon = document.getElementById('minimize-icon');
            if (initIcon) initIcon.textContent = '▼';

            // In embed mode the player skips the constrain-and-position pass
            // it does for the full-mode left-sidebar layout, so Webamp's main
            // window floats wherever its default transform puts it (typically
            // the middle of the viewport). Pin it to the top-left of the
            // webamp-wrapper, retrying while Webamp settles.
            const pinWebamp = (attempts = 0) => {
                const mainWindow = document.querySelector('#main-window');
                const webampElement = document.getElementById('webamp');
                const wrapper = document.querySelector('.webamp-wrapper');
                if (!mainWindow || !webampElement || !wrapper) {
                    if (attempts < 30) setTimeout(() => pinWebamp(attempts + 1), 100);
                    return;
                }
                wrapper.appendChild(webampElement);
                wrapper.style.position = 'relative';
                webampElement.style.display = 'block';
                webampElement.style.visibility = 'visible';
                webampElement.style.opacity = '1';
                const mainWindowParent = mainWindow.parentElement;
                if (mainWindowParent && mainWindowParent.style) {
                    mainWindowParent.style.transform = 'translate(0px, 0px)';
                }
            };
            pinWebamp();

            /*
             * And again whenever the viewport changes.
             *
             * Webamp's window is draggable and carries its position in a
             * transform on its parent. Pinning it once at startup is not
             * enough: rotating the phone, or resetting a zoom, leaves that
             * transform holding a position that no longer means what it did
             * and the player drifts out of the corner of the bar -- 8px
             * right after one rotation here, and Justin watched it jump in
             * Firefox when he reset the zoom.
             *
             * This puts it back. It does not stop the dragging, which is
             * the real fix and belongs upstream in Webamp; until that
             * exists, a window that wanders home on the next resize is a
             * good deal better than one that stays where it was pushed.
             */
            let repinTimer = null;
            const repin = () => {
                clearTimeout(repinTimer);
                repinTimer = setTimeout(() => pinWebamp(), 60);
            };
            window.addEventListener('resize', repin);
            window.addEventListener('orientationchange', repin);

            /*
             * And hold it there.
             *
             * Checked upstream rather than hoping: Webamp's public Options
             * today are availableSkins, enableDoubleSizeMode, enableHotkeys,
             * enableMediaSession, filePickers, the three handle* callbacks,
             * initialSkin, initialTracks, requireButterchurnPresets,
             * windowLayout and zIndex. There is no sticky mode and nothing
             * tracking one -- the only issue whose title matches, #129, is
             * about windows snapping to each other and was closed in 2016.
             * We are on 1.5.0 against a current 2.3.1, and none of the
             * versions between add one.
             *
             * So pin it here. Webamp carries the window's position as a
             * transform on its parent; anything that moves it -- a drag, a
             * zoom, a rotation -- writes that attribute, and this writes it
             * back. The same trick the full-mode layout already uses, which
             * is where I should have looked first.
             *
             * This is a dock, not a desktop: the player has one place to be.
             */
            const holdWebampStill = (attempts = 0) => {
                const mainWindow = document.querySelector('#main-window');
                if (!mainWindow || !mainWindow.parentElement) {
                    if (attempts < 30) setTimeout(() => holdWebampStill(attempts + 1), 100);
                    return;
                }
                const parent = mainWindow.parentElement;
                const HOME = 'translate(0px, 0px)';
                new MutationObserver(() => {
                    if (parent.style.transform !== HOME) {
                        parent.style.transform = HOME;
                    }
                }).observe(parent, { attributes: true, attributeFilter: ['style'] });
                parent.style.transform = HOME;
            };
            holdWebampStill();
        }

        // Listen for "Apply Changes" from the editor inside the iframe
        // (Release:.../Metadata page). The iframe editor doesn't have a
        // reference to this player, so it postMessages the new timeline
        // and we hot-swap it here.
        window.addEventListener('message', (event) => {

            if (!msg || msg.type !== 'rabbithole:metadata-applied') return;
            if (!window.chartifactsPlayer) return;
            // Update timeline (visualization changes immediately)

                if (msg.ensemble) window.songChartifactsData.ensemble = msg.ensemble;

        // Add click handlers after player loads
        setTimeout(addMusicianClickHandlers, 2000);

        // Instrument icons mapping
        const instrumentIcons = {
            'guitar': '🎸',
            'mandolin': '🎸',
            'banjo': '🪕',
            '5-string banjo': '🪕',
            'fiddle': '🎻',
            'violin': '🎻',
            'bass': '🎸',
            'dobro': '🎸',
            'cello': '🎻',
            'tin whistle': '🎵',
            'vocals': '🎤',
            'throatsinging': '🎤'
        };

        // Get initials from full name (e.g., "Justin Holmes" -> "JH")

        // Get instrument icon
        function getInstrumentIcon(instruments) {

        // Update mini musicians list
        function updateMiniMusicians() {

            const miniMusicians = document.querySelectorAll('.mini-musician');

        // Toggle sidebar minimize/maximize
        window.toggleSidebar = function() {

                // Webamp's own #shade div doesn't fire its handler (Webamp
                // listens for pointerdown, not click), so dispatch the
                // Redux action directly. The action is a toggle, so we
                // only fire when our class state DOESN'T already match
                // Webamp's shade state — keeps us in sync if the user
                // also poked Webamp's own shade button.
                if (window.chartifactsPlayer && window.chartifactsPlayer.webamp && window.chartifactsPlayer.webamp.store) {
                    const store = window.chartifactsPlayer.webamp.store;

        window.seekMini = function(event) {
            if (window.chartifactsPlayer && window.chartifactsPlayer.webamp && window.chartifactsPlayer.webamp.store) {
                const rect = event.currentTarget.getBoundingClientRect();
                const clickY = event.clientY - rect.top;
                const height = rect.height;
                const percent = 1 - (clickY / height);
                const duration = window.songChartifactsData.duration || 180;
                const seekTime = Math.max(0, Math.min(duration, percent * duration));

                window.chartifactsPlayer.webamp.store.dispatch({
                    type: 'SEEK_TO_PERCENT_COMPLETE',

                });

        setInterval(() => {
            if (window.chartifactsPlayer && window.chartifactsPlayer.webamp && window.chartifactsPlayer.webamp.store) {
                const state = window.chartifactsPlayer.webamp.store.getState();
                const { status, timeElapsed, length } = state.media;
                const duration = length || window.songChartifactsData.duration || 180;

                // Update play button states (both mini and inline)

                        inlineBtn.classList.remove('playing');

                const percent = timeElapsed / duration;
                const circumference = 2 * Math.PI * 18; // r=18
                const offset = circumference * (1 - percent);
                document.getElementById('mini-progress-circle').style.strokeDashoffset = offset;

                // Update time
                const mins = Math.floor(timeElapsed / 60);
                const secs = Math.floor(timeElapsed % 60).toString().padStart(2, '0');
                document.getElementById('mini-time').textContent = mins + ':' + secs;
            }
        }, 250);

        // ============================================
        // Timeline Editor Integration
        // ============================================

        let editorInstance = null;

        async function saveToWiki() {
            if (!editableData || !editableData.isDirty) {
                return;
            }

            const saveBtn = document.getElementById('save-to-wiki-btn');
            const statusSpan = document.getElementById('save-status');

            saveBtn.disabled = true;
            saveBtn.classList.add('saving');
            saveBtn.textContent = 'Saving...';
            statusSpan.textContent = '';
            statusSpan.className = '';

            try {
                const currentSong = window.songChartifactsData;

                // If this song was loaded via ?track= URL param, write back
                // to its Release:Qm.../Metadata page using plain YAML and the
                // recording-metadata-yaml content model. Same-origin with
                // pickipedia.xyz, so the user's session cookie + CSRF token
                // dance just works.
                if (currentSong._metadataTitle) {
                    const yamlBody = jsYaml.dump({
                        timeline: editableData.workingData.timeline || {},
                        ensemble: editableData.workingData.ensemble || {},
                        ...(editableData.workingData.standardSectionLength != null
                            ? { standardSectionLength: editableData.workingData.standardSectionLength }
                            : {}),
                        ...(currentSong.title ? { title: currentSong.title } : {})
                    }, { sortKeys: false, lineWidth: 120 });

                    const tokRes = await fetch(
                        '/api.php?action=query&meta=tokens&format=json',
                        { credentials: 'include' }
                    );
                    const tokJson = await tokRes.json();
                    const csrf = tokJson.query?.tokens?.csrftoken;
                    if (!csrf || csrf === '+\\') {
                        throw new Error('Not logged in to PickiPedia.');
                    }

                    const editParams = new URLSearchParams({
                        action: 'edit',
                        title: currentSong._metadataTitle,
                        text: yamlBody,
                        summary: 'Update timeline data via Rabbithole Editor',
                        token: csrf,
                        contentmodel: 'recording-metadata-yaml',
                        format: 'json'
                    });
                    const r = await fetch('/api.php', {
                        method: 'POST',
                        body: editParams,
                        credentials: 'include'
                    });
                    const j = await r.json();
                    if (j.error) {
                        throw new Error(j.error.info || j.error.code);
                    }
                    editableData.markSaved();
                    statusSpan.textContent = 'Saved!';
                    statusSpan.className = 'success';
                    saveBtn.textContent = 'Saved';

                } else {
                    // Local dev / standalone demo path — write to the legacy
                    // Recording:Song (Album)/Rabbithole subpage.
                    const { WikiSync, trackDataToWikiFormat } = await import('./src/editor/wiki-sync.js');
                    const wikiSync = new WikiSync();
                    const recordingTitle = `${currentSong.title} (${currentSong.album})`;
                    const wikiData = trackDataToWikiFormat(editableData.workingData);
                    const result = await wikiSync.saveRabbitholeData(recordingTitle, wikiData, {
                        summary: 'Update timeline data via Rabbithole Editor'
                    });
                    if (result.success) {
                        editableData.markSaved();
                        statusSpan.textContent = 'Saved!';
                        statusSpan.className = 'success';
                        saveBtn.textContent = 'Saved';
                    } else {
                        throw new Error(result.error || 'Save failed');
                    }
                }

            } catch (error) {
                console.error('Save failed:', error);
                statusSpan.textContent = error.message;
                statusSpan.className = 'error';
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save to PickiPedia';
            }

            saveBtn.classList.remove('saving');
        }

        // Handle song change - reinitialize editor if open
        const originalLoadSelectedSong = window.loadSelectedSong;
        window.loadSelectedSong = async function() {
            await originalLoadSelectedSong();

            // If editor is open, reinitialize with new song
            if (editorInstance) {
                const currentSong = window.songChartifactsData;
                const recordingTitle = `${currentSong.title} (${currentSong.album})`;

                // Check for unsaved changes
                if (editableData && editableData.isDirty) {
                    if (!confirm('You have unsaved changes. Switch songs anyway?')) {
                        return;
                    }
                }

                // Clean up old editor
                if (keyboardShortcuts) keyboardShortcuts.dispose();
                if (editorInstance) editorInstance.dispose();
                if (editableData) editableData.dispose();

                // Reinitialize
                await initializeEditor();
            }
        };
    </script>
</body>
</html>
